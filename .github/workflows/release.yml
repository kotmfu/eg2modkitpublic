name: Release

on:
  push:
    branches: [main]
    paths:
      - modkit/**
      - '!modkit/tools/**'
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build xinput1_4.dll proxy
        shell: cmd
        run: modkit\native\winmm\build.cmd

      - name: Publish
        run: |
          dotnet publish modkit/src/Eg2.ModManager -p:PublishProfile=FolderProfile -o out/modkit
          dotnet publish modkit/src/Eg2.ModInstaller -p:PublishProfile=FolderProfile -o out/installer

      - name: Next version
        id: ver
        run: |
          # carries on from the old mi-* installer tags
          last=$(git tag -l 'v*' 'mi-*' | sed 's/^v//; s/^mi-//' | sort -V | tail -1)
          IFS=. read -r major minor patch <<< "$last"
          v="${major:-1}.${minor:-0}.$(( ${patch:--1} + 1 ))"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          (cd out/modkit && 7z a "../../eg2modkitv${{ steps.ver.outputs.v }}.7z" Eg2ModManager.* Eg2.*.dll runtime -x!*.pdb)
          (cd out/installer && 7z a "../../eg2modinstallerv${{ steps.ver.outputs.v }}.7z" Eg2ModInstaller.* Eg2.*.dll runtime -x!*.pdb)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.ver.outputs.v }}"
          "eg2modkitv${{ steps.ver.outputs.v }}.7z" "eg2modinstallerv${{ steps.ver.outputs.v }}.7z"
          --target "$GITHUB_SHA" --title "EG2 ModKit V${{ steps.ver.outputs.v }}" --notes "TBD"
